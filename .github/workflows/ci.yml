name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      direct_merge_performance:
        description: Compare direct merges with the pre-integration baseline
        type: boolean
        default: false

      vacuum_performance:
        description: Compare direct VACUUM merges with main before integration
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PGRX_VERSION: 0.19.1

jobs:
  # Formatting and the pure-Python harness need no PostgreSQL; fail fast here.
  lint:
    name: Format and harness tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: Source attribution
        run: |
          python3 script/source_headers.py
          python3 -m unittest discover -s script -p 'test_*.py'
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Benchmark harness unit tests
        run: python3 -m unittest discover -s benchmarks -p 'test_*.py'
      - name: Published benchmark query adapter
        run: |
          python3 benchmarks/tin.py --driver "$RUNNER_TEMP/stannum-benchmark-driver" prepare
          BENCHMARK_DRIVER="$RUNNER_TEMP/stannum-benchmark-driver" node --test \
            benchmarks/tin/adapter.test.mjs \
            "$RUNNER_TEMP/stannum-benchmark-driver/benchmarks/queries.test.js"

  # Both architectures matter: `c_char` is signed on x86-64 and unsigned on
  # AArch64, and both PostgreSQL majors have caught API differences.
  build-and-test:
    name: ${{ matrix.arch.name }} / PostgreSQL ${{ matrix.postgres }}
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch:
          - name: x86-64
            runner: ubuntu-24.04
          - name: arm64
            runner: ubuntu-24.04-arm
        postgres: [17, 18]
    env:
      PG_MAJOR: ${{ matrix.postgres }}
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # PGDG packages instead of building PostgreSQL from source: the same
      # server binaries users install, and minutes instead of tens of minutes.
      - name: Install PostgreSQL ${{ matrix.postgres }} from PGDG
        run: |
          sudo apt-get install --yes --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --yes --no-install-recommends \
            "postgresql-${PG_MAJOR}" "postgresql-server-dev-${PG_MAJOR}" \
            libclang-dev pkg-config libssl-dev
          sudo systemctl stop postgresql || true
          # pgrx installs the extension into the server's own directories.
          sudo chown -R "$USER" "/usr/lib/postgresql/${PG_MAJOR}" "/usr/share/postgresql/${PG_MAJOR}"
          echo "/usr/lib/postgresql/${PG_MAJOR}/bin" >> "$GITHUB_PATH"

      - name: Install pinned Rust toolchain and Clippy
        run: rustup component add clippy

      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          key: pg${{ matrix.postgres }}

      - name: Cache cargo-pgrx
        id: pgrx-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-pgrx
          key: cargo-pgrx-${{ env.PGRX_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-pgrx
        if: steps.pgrx-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-pgrx --version "$PGRX_VERSION" --locked

      - name: Point pgrx at the installed server
        run: |
          echo "PGRX_HOME=$RUNNER_TEMP/pgrx" >> "$GITHUB_ENV"
          PGRX_HOME="$RUNNER_TEMP/pgrx" cargo pgrx init "--pg${PG_MAJOR}=/usr/lib/postgresql/${PG_MAJOR}/bin/pg_config"

      - name: Build
        run: cargo build --locked --package stannum --no-default-features --features "pg${PG_MAJOR}"

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --no-default-features --features "pg${PG_MAJOR} pg_test" -- -D warnings

      - name: Library crate tests
        run: cargo test --locked --workspace --exclude stannum

      - name: Extension tests
        run: cargo pgrx test "pg${PG_MAJOR}" --package stannum --no-default-features --features "pg${PG_MAJOR} pg_test"

      - name: Install release build
        run: cargo pgrx install --release --package stannum --no-default-features --features "pg${PG_MAJOR}"

      - name: Release schema and upgrade compatibility
        run: python3 postgres/tests/extension_upgrade.py

      # Crash recovery, VACUUM, folds and merges, standby fallback and
      # backend reuse, against a real server in a throwaway cluster.
      - name: Index lifecycle checks
        run: python3 postgres/tests/postings_lifecycle.py

      # Randomized concurrent writers against ranked readers, each checked in
      # one snapshot against the unpruned path and a regex scan; fixed seeds
      # plus the regression list, under two minutes.
      - name: Ranked-scan concurrency fuzz (smoke)
        run: python3 postgres/tests/ranked_fuzz.py --smoke

      - name: Mutation target and accounting regression
        run: python3 benchmarks/mutation_targets.py

      - name: VACUUM pinned-page regression
        run: python3 benchmarks/vacuum_cleanup_pins.py

      - name: VACUUM workload harness smoke
        run: |
          smoke_dir="$RUNNER_TEMP/vacuum-workload-smoke"
          mkdir -p "$smoke_dir"
          installed_library="$(pg_config --pkglibdir)/stannum.so"
          cp "$installed_library" "$smoke_dir/candidate.so"
          python3 benchmarks/paired_libraries.py \
            --baseline "$smoke_dir/candidate.so" --integrated "$smoke_dir/candidate.so" \
            --installed-library "$installed_library" --checkpoint-control \
            --workload vacuum --scenario mixed --docs 32768 --repeat 20 --rounds 1 \
            --baseline-vacuum-strategy direct --integrated-vacuum-strategy reconstruct \
            --query-shapes mixed --reader-rate 200 --reader-seconds 4 \
            --output "$smoke_dir/results"

      - name: Retain VACUUM harness smoke
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vacuum-smoke-${{ matrix.arch.name }}-pg${{ matrix.postgres }}
          path: ${{ runner.temp }}/vacuum-workload-smoke/results
          if-no-files-found: ignore
          retention-days: 7

      - name: Sustained mixed-write harness smoke
        run: |
          python3 benchmarks/sustained.py \
            --artifact "$(pg_config --pkglibdir)/stannum.so" \
            --output "$RUNNER_TEMP/sustained-smoke" \
            --engines stannum,gin,gin-no-fastupdate --profile mutation-count \
            --rows 10000 --seconds 20 --warmup 1 --rounds 1 \
            --write-rates 200 --writer-counts 2 --read-rate 100 \
            --vacuum-interval 5 --check-interval 5

      - name: Retain sustained mixed-write smoke
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sustained-smoke-${{ matrix.arch.name }}-pg${{ matrix.postgres }}
          path: ${{ runner.temp }}/sustained-smoke
          if-no-files-found: ignore
          retention-days: 7

      # Opt-in promotion gate: both binaries run on the same runner. No timing
      # threshold is asserted on shared CI hardware; retain pairs for review.
      # The paired driver restores libraries only after confirmed shutdown;
      # an unconditional shell EXIT restore would defeat that safety check.
      - name: Compare direct-merge contention
        if: github.event_name == 'workflow_dispatch' && inputs.direct_merge_performance
        run: |
          comparison_dir="$RUNNER_TEMP/direct-merge-comparison"
          mkdir -p "$comparison_dir"
          installed_library="$(pg_config --pkglibdir)/stannum.so"
          cp "$installed_library" "$comparison_dir/integrated.so"
          # This baseline has the same extension SQL and on-disk format.
          baseline_commit=26b9d1ec0f2cad8e84386cf26b63afe3dadcd42c
          git fetch --no-tags origin "$baseline_commit"
          git worktree add --detach "$comparison_dir/baseline-source" "$baseline_commit"
          (
            cd "$comparison_dir/baseline-source"
            CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo pgrx install --release \
              --package stannum --no-default-features --features "pg${PG_MAJOR}"
          )
          cp "$installed_library" "$comparison_dir/baseline.so"
          cp "$comparison_dir/integrated.so" "$installed_library"
          for repetition in 200 20; do
            python3 benchmarks/paired_libraries.py \
              --baseline "$comparison_dir/baseline.so" \
              --integrated "$comparison_dir/integrated.so" \
              --installed-library "$installed_library" \
              --checkpoint-control --seconds 20 --rounds 3 --repeat "$repetition" \
              --output "$comparison_dir/results/repeat$repetition"
          done

      - name: Retain direct-merge comparisons
        if: always() && github.event_name == 'workflow_dispatch' && inputs.direct_merge_performance
        uses: actions/upload-artifact@v4
        with:
          name: direct-merge-${{ matrix.arch.name }}-pg${{ matrix.postgres }}
          path: ${{ runner.temp }}/direct-merge-comparison/results
          if-no-files-found: warn
          retention-days: 7

      - name: Compare direct VACUUM merges
        if: github.event_name == 'workflow_dispatch' && inputs.vacuum_performance
        run: |
          comparison_dir="$RUNNER_TEMP/vacuum-merge-comparison"
          mkdir -p "$comparison_dir"
          installed_library="$(pg_config --pkglibdir)/stannum.so"
          cp "$installed_library" "$comparison_dir/integrated.so"
          baseline_commit=80e5f85e05b178c58e24a73d30a794a9004c4a18
          git fetch --no-tags origin "$baseline_commit"
          git worktree add --detach "$comparison_dir/baseline-source" "$baseline_commit"
          (
            cd "$comparison_dir/baseline-source"
            CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo pgrx install --release \
              --package stannum --no-default-features --features "pg${PG_MAJOR}"
          )
          cp "$installed_library" "$comparison_dir/baseline.so"
          cp "$comparison_dir/integrated.so" "$installed_library"
          for repetition in 200 20; do
            for scenario in merge rewrite mixed; do
              python3 benchmarks/paired_libraries.py \
                --baseline "$comparison_dir/baseline.so" \
                --integrated "$comparison_dir/integrated.so" \
                --installed-library "$installed_library" \
                --checkpoint-control --workload vacuum --scenario "$scenario" --rounds 3 \
                --repeat "$repetition" --output "$comparison_dir/results/repeat$repetition/$scenario"
            done
          done
          python3 benchmarks/paired_libraries.py \
            --baseline "$comparison_dir/baseline.so" \
            --integrated "$comparison_dir/integrated.so" \
            --installed-library "$installed_library" \
            --checkpoint-control --workload vacuum --scenario mixed --rounds 3 \
            --docs 131072 --repeat 20 --delete-percent 50 --vocabulary 997 --distribution hot \
            --query-shapes mixed --reader-rate 200 --reader-seconds 12 \
            --output "$comparison_dir/results/larger-fixed-arrival"
          # Same release binary, different registered strategies: compare full
          # validation on both paths rather than the historical reconstruction.
          python3 benchmarks/paired_libraries.py \
            --baseline "$comparison_dir/integrated.so" \
            --integrated "$comparison_dir/integrated.so" \
            --installed-library "$installed_library" \
            --baseline-vacuum-strategy direct --integrated-vacuum-strategy reconstruct \
            --checkpoint-control --workload vacuum --scenario mixed --repeat 20 --rounds 3 \
            --query-shapes mixed --reader-rate 200 --reader-seconds 12 \
            --output "$comparison_dir/results/forced-strategies"

      - name: Retain VACUUM comparisons
        if: always() && github.event_name == 'workflow_dispatch' && inputs.vacuum_performance
        uses: actions/upload-artifact@v4
        with:
          name: vacuum-merge-${{ matrix.arch.name }}-pg${{ matrix.postgres }}
          path: ${{ runner.temp }}/vacuum-merge-comparison/results
          if-no-files-found: warn
          retention-days: 7

  # Behavioral regression suite: the same fixture, 47 query shapes and five
  # mutation states on Stannum and on the original Lead, checked out directly
  # from PlanetScale's repository and built under its own name `tin`. Match
  # sets and rank order must agree; Lead's score bits are not compared (see
  # docs/benchmarks/README.md for the two known deviations).
  reference-oracle:
    name: Reference oracle against upstream Lead
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PG_MAJOR: 18
      LEAD_REPOSITORY: planetscale/lead
      LEAD_REF: main
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Check out upstream Lead
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ env.LEAD_REPOSITORY }}
          ref: ${{ env.LEAD_REF }}
          path: lead-ref
      - name: Install PostgreSQL ${{ env.PG_MAJOR }} from PGDG
        run: |
          sudo apt-get install --yes --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --yes --no-install-recommends \
            "postgresql-${PG_MAJOR}" "postgresql-server-dev-${PG_MAJOR}" libclang-dev pkg-config libssl-dev
          sudo systemctl stop postgresql || true
          sudo chown -R "$USER" "/usr/lib/postgresql/${PG_MAJOR}" "/usr/share/postgresql/${PG_MAJOR}"
          echo "/usr/lib/postgresql/${PG_MAJOR}/bin" >> "$GITHUB_PATH"
      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          key: pg${{ env.PG_MAJOR }}-reference
          workspaces: |
            . -> target
            lead-ref -> target
      - name: Cache cargo-pgrx
        id: pgrx-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-pgrx
          key: cargo-pgrx-${{ env.PGRX_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install cargo-pgrx
        if: steps.pgrx-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-pgrx --version "$PGRX_VERSION" --locked
      - name: Point pgrx at the installed server
        run: |
          echo "PGRX_HOME=$RUNNER_TEMP/pgrx" >> "$GITHUB_ENV"
          PGRX_HOME="$RUNNER_TEMP/pgrx" cargo pgrx init "--pg${PG_MAJOR}=/usr/lib/postgresql/${PG_MAJOR}/bin/pg_config"
      - name: Start a throwaway cluster
        run: |
          initdb -D "$RUNNER_TEMP/oracle-data" -U "$USER" -A trust --no-locale --encoding=UTF8
          # Debian builds default the socket directory to /var/run/postgresql,
          # which the runner user cannot write.
          pg_ctl -D "$RUNNER_TEMP/oracle-data" \
            -o "-p 28999 -c listen_addresses=localhost -c unix_socket_directories=$RUNNER_TEMP" \
            -l "$RUNNER_TEMP/oracle.log" -w start || { cat "$RUNNER_TEMP/oracle.log"; exit 1; }
      - name: Build both extensions and run the oracle
        env:
          PGHOST: localhost
          PGPORT: 28999
          LEAD_REF_DIR: ${{ github.workspace }}/lead-ref
        run: script/reference-oracle "$RUNNER_TEMP/reference-oracle"
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-oracle
          path: ${{ runner.temp }}/reference-oracle
          if-no-files-found: ignore
