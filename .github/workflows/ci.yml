name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.arch.name }} / PostgreSQL ${{ matrix.postgres }}
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch:
          - name: x86-64
            runner: ubuntu-24.04
          - name: arm64
            runner: ubuntu-24.04-arm
        postgres: [17, 18]

    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Configure pgrx home
        run: echo "PGRX_HOME=$RUNNER_TEMP/pgrx" >> "$GITHUB_ENV"

      - name: Install PostgreSQL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bison \
            build-essential \
            ccache \
            flex \
            libreadline-dev \
            libssl-dev \
            libxml2-dev \
            libxml2-utils \
            libxslt1-dev \
            pkg-config \
            xsltproc \
            zlib1g-dev

      - name: Install pinned Rust toolchain and Clippy
        run: rustup component add clippy

      - name: Install cargo-pgrx
        run: cargo install cargo-pgrx --version 0.19.1 --locked

      - name: Install PostgreSQL ${{ matrix.postgres }}
        env:
          PG_MAJOR: ${{ matrix.postgres }}
        run: cargo pgrx init "--pg${PG_MAJOR}=download" --jobs "$(nproc)"

      - name: Build
        env:
          PG_MAJOR: ${{ matrix.postgres }}
        run: cargo build --locked --package tin --no-default-features --features "pg${PG_MAJOR}"

      - name: Clippy
        env:
          PG_MAJOR: ${{ matrix.postgres }}
        run: cargo clippy --locked --workspace --all-targets --no-default-features --features "pg${PG_MAJOR} pg_test" -- -D warnings

      - name: Test local suite
        env:
          PG_MAJOR: ${{ matrix.postgres }}
        run: cargo pgrx test "pg${PG_MAJOR}" --package tin --no-default-features --features "pg${PG_MAJOR}"
