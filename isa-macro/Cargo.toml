[package]
name = "isa-macro"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "`#[hot]`: a function compiled twice on x86-64, portable and for x86-64-v3, chosen at runtime"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
