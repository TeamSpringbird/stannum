area: query_size
description: >
  Query size and nesting. The term 'a' matches no document, so every correct
  count is 0. Imported from TIN 1.0.3's recorded responses (2026-09-26):
  TIN answered the smaller sizes and crashed the whole server (every backend
  restarted) on the larger ones. An engine must answer every size TIN
  answered with TIN's count, and answer the sizes that crashed TIN with an
  ERROR or the correct count, never a crash.

  Every size above 100 is tagged as crashing Stannum 0.1.0 until the
  query-depth fix lands: run this area only on a throwaway server you may
  restart. Whether a size crashes depends on the build and the server's
  stack limit; see stannum_observations.

stannum_observations:
  - date: 2026-09-26
    server: local Homebrew PostgreSQL 18.6, aarch64-apple-darwin
    stack_limit: "rlimit 8176kB (max_stack_depth may not exceed 7664kB); max_stack_depth 2MB"
    build: release stannum.dylib installed 14:44 ET (before the query-depth fix)
    result: >
      private initdb server: every size up to 3000 terms and 1000-deep
      nesting answered 0; 10000 terms, the 10000-term OR chain and 5000-deep
      nesting crashed the server.
  - date: 2026-09-26
    server: shared pgrx server (port 28818), same binary and stack limit
    stack_limit: "rlimit 8176kB (max_stack_depth may not exceed 7664kB); max_stack_depth 2MB"
    build: uncertain; another session replaced stannum.dylib in place at 15:01:35 ET
    result: >
      15:01:18-15:01:27 ET: 1000 and 3000 terms (both shapes) and 1000-deep
      nesting crashed the server (SIGSEGV), 100-deep nesting answered.
      These crashes coincide with the library being overwritten, so they
      may come from a half-written library rather than the query size.
  - date: 2026-09-26
    server: private initdb server
    stack_limit: "rlimit 8176kB (max_stack_depth may not exceed 7664kB); max_stack_depth 2MB"
    build: stannum.dylib installed 15:01:35 ET (debug build containing a query-depth limit)
    result: every size answered 0, except 5000-deep nesting, which raised ERROR XX000.

defaults:
  corpus: spans4
  risky: true
  capture: [count]

cases:
  - id: query_size.words.1000
    description: 1000 space-separated terms (implicit AND).
    query_sql: "repeat('a ', 1000)"
    crashes: [stannum-0.1.0]
  - id: query_size.words.3000
    description: 3000 space-separated terms.
    query_sql: "repeat('a ', 3000)"
    crashes: [stannum-0.1.0]
  - id: query_size.words.10000
    description: 10000 space-separated terms; crashed TIN 1.0.3's server.
    query_sql: "repeat('a ', 10000)"
    crashes: [tin-1.0.3, stannum-0.1.0]
    expect_if_answered: {count: 0}
  - id: query_size.or_chain.1000
    description: "'a OR a OR ...' with 1000 terms."
    query_sql: "array_to_string(array_fill('a'::text, ARRAY[1000]), ' OR ')"
    crashes: [stannum-0.1.0]
  - id: query_size.or_chain.3000
    description: "'a OR a OR ...' with 3000 terms."
    query_sql: "array_to_string(array_fill('a'::text, ARRAY[3000]), ' OR ')"
    crashes: [stannum-0.1.0]
  - id: query_size.or_chain.10000
    description: "'a OR a OR ...' with 10000 terms; crashed TIN 1.0.3's server."
    query_sql: "array_to_string(array_fill('a'::text, ARRAY[10000]), ' OR ')"
    crashes: [tin-1.0.3, stannum-0.1.0]
    expect_if_answered: {count: 0}
  - id: query_size.nested.100
    description: "'a' inside 100 levels of parentheses."
    query_sql: "repeat('(', 100) || 'a' || repeat(')', 100)"
  - id: query_size.nested.1000
    description: "'a' inside 1000 levels of parentheses."
    query_sql: "repeat('(', 1000) || 'a' || repeat(')', 1000)"
    crashes: [stannum-0.1.0]
  - id: query_size.nested.5000
    description: "'a' inside 5000 levels of parentheses; crashed TIN 1.0.3's server."
    query_sql: "repeat('(', 5000) || 'a' || repeat(')', 5000)"
    crashes: [tin-1.0.3, stannum-0.1.0]
    expect_if_answered: {count: 0}
