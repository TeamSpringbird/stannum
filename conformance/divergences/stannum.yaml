# Where Stannum knowingly answers differently from a recorded engine.
#
# In check mode the runner reads this file for the engine under test and the
# recorded engine-version named by `against` (one version or a list). A
# listed case reports
#   IMPROVED  when kind is improvement: the recorded engine raised an ERROR on
#             each listed capture and Stannum answered;
#   GAP       when kind is gap: Stannum lacks what the case exercises.
# Either way only the listed captures may differ. If another capture differs,
# a listed capture matches again, or an improvement stops answering, the case
# FAILs, so this file cannot hide a regression.
#
# `question` is what we would ask the recorded engine's authors.

divergences:
  - id: catalog.S-14
    against: [tin-1.0.3, tin-1.0.4]
    kind: improvement
    captures: [different_dense_ratio, row_dependent_k1]
    summary: TIN refuses differing dense_ratio arguments and a row-dependent k1; Stannum scores each call with its own arguments.
    tin: >
      XX000 "tin.score() calls on one relation must use identical dense_ratio
      arguments" and "tin.score() parameters must be statement-constant
      expressions or external parameters".
    stannum: Every call is scored with its own dense_ratio and, per row, its own k1.
    question: >
      Why are these not supported? k1 may already differ between calls in
      one statement; is dense_ratio fixed because elision is decided once per
      scan, and is a row-dependent k1 refused for the same reason?

  - id: catalog.S-15
    against: [tin-1.0.3, tin-1.0.4]
    kind: improvement
    captures: [value]
    summary: TIN refuses score() and full_score() on one relation; Stannum returns both.
    tin: >
      XX000 "tin.score() and tin.full_score() cannot be combined on one
      scanned relation; use one scoring function per relation".
    stannum: Both functions are answered in the same statement, each with its own value.
    question: >
      Why is this not supported? Is it because the scan computes one kind of
      score per relation, and would it be accepted if the scan computed both?

  - id: catalog.S-22
    against: [tin-1.0.3, tin-1.0.4]
    kind: improvement
    captures: [full_bits, score_bits]
    summary: TIN refuses to score with its custom scan disabled; Stannum returns the same scores either way.
    tin: >
      With the custom scan on, the scores Stannum also returns; with it off,
      XX000 (scoring requires TIN's custom scan).
    stannum: Bit-identical scores with stannum.enable_custom_scan on and off.
    question: >
      Why is scoring not supported without the custom scan? A plan the
      planner is free to choose, or a user setting, then decides whether a
      query succeeds.

  - id: catalog.K-12
    against: [tin-1.0.3, tin-1.0.4]
    kind: improvement
    captures: [custom_scan_off]
    summary: TIN refuses a non-default-tokenization index query without its custom scan; Stannum answers it.
    tin: >
      With the custom scan off, XX000 "queries targeting a tin index with
      non-default tokenization require a usable custom scan".
    stannum: The same matches with the custom scan on and off.
    question: >
      Why is this not supported? The docs do not mention that non-default
      tokenization depends on the custom scan.

  - id: catalog.H-14
    against: tin-1.0.3
    kind: improvement
    captures: [highlight]
    summary: TIN refuses implicit highlight() on a non-default-tokenization index; Stannum highlights with the index's tokenizer.
    tin: >
      XX000 "implicit tin.highlight() is not supported with non-default index
      tokenization".
    stannum: Highlights with the index's tokenizer, here case_folding=preserve.
    question: >
      Why is this not supported? The explicit form works; is the implicit
      form missing the index's tokenizer options?
    note: TIN 1.0.4 answers it as Stannum does, so the entry applies to 1.0.3 only.

  - id: catalog.I-07
    against: [tin-1.0.3, tin-1.0.4]
    kind: gap
    captures: [error]
    summary: Stannum has no maintenance_jobs_per_db setting, so a session SET of it is not refused.
    tin: 55P02 "parameter "tin.maintenance_jobs_per_db" cannot be changed now".
    stannum: >
      Stannum runs no background maintenance workers and defines no such
      setting. PostgreSQL accepts a SET of any undefined stannum.* name as a
      placeholder.

  - id: catalog.S-07
    against: [tin-1.0.3, tin-1.0.4]
    kind: gap
    captures: [script]
    summary: Stannum has no promote() function, so the case's promote step fails.
    tin: tin.promote(index) moves the mutable segment into an immutable one and returns its statistics.
    stannum: No promote(); its write buffer is folded into segments by inserts and VACUUM.

  - id: catalog.S-07b
    against: [tin-1.0.3, tin-1.0.4]
    kind: gap
    captures: [script]
    summary: Stannum has no promote() and its segment_info() has other columns, so the promote steps differ.
    tin: >
      promote() returns one row (consumed_controls, linked_segments,
      docs_promoted, terms_added); here all zero, as the 20 rows sit in the
      current write segment, which promote() does not consume.
    stannum: No promote(); its write buffer is folded into segments by inserts and VACUUM.

  - id: catalog.S-07c
    against: [tin-1.0.3, tin-1.0.4]
    kind: gap
    captures: [script]
    summary: Stannum has no promote() and its segment_info() has other columns, so the promote steps differ.
    tin: promote() on an index whose rows were all built into an immutable segment returns zeros.
    stannum: No promote().

  - id: catalog.S-07d
    against: [tin-1.0.3, tin-1.0.4]
    kind: gap
    captures: [script]
    summary: Stannum has no promote() and its segment_info() has other columns, so the promote steps differ.
    tin: promote() returns zeros with 200 rows in the current write segment; nothing is elided before or after.
    stannum: No promote().

  - id: catalog.S-07e
    against: [tin-1.0.3, tin-1.0.4]
    kind: gap
    captures: [script]
    summary: Stannum has no promote() and its segment_info() has other columns, so the promote steps differ.
    tin: promote() returns zeros on a built index.
    stannum: No promote().

  - id: catalog.S-07f
    against: [tin-1.0.3, tin-1.0.4]
    kind: gap
    captures: [script]
    summary: Stannum has no promote(), sealed write segments or maintenance modes.
    tin: >
      With maintenance manual, 12,288 rows fill a sealed write segment;
      promote() consumes it (1, 1, 12288, 12293) and elision then counts
      the promoted documents only.
    stannum: No promote(); elision counts every document the index holds.

  - id: catalog.S-07g
    against: [tin-1.0.3, tin-1.0.4]
    kind: gap
    captures: [script]
    summary: Stannum has no promote(index, extent_cap_bytes).
    tin: promote(index, 1) writes 68 segments of about 185 documents; elision is unchanged.
    stannum: No promote().

  - id: catalog.S-07h
    against: [tin-1.0.3, tin-1.0.4]
    kind: gap
    captures: [value, zero_cap]
    summary: Stannum has no promote() function.
    tin: >
      promote(index regclass, extent_cap_bytes bigint DEFAULT NULL) returns
      TABLE(consumed_controls, linked_segments, docs_promoted, terms_added);
      a cap of 0 is XX000 "extent_cap_bytes must be positive".
    stannum: No promote().

  - id: limits.at_least_near.2
    against: tin-1.0.3
    kind: limit
    captures: [ids]
    summary: Stannum refuses AT LEAST inside a proximity operator past 10,000 combinations (C(16, 8) = 12,870); TIN answers.
    tin: Answers {3} in about 0.65 s over 27 rows.
    stannum: >
      54001 "... AT LEAST 8 OF 16 operands inside a proximity operator expands
      to more than 10000 combinations". The same expansion at C(30, 15)
      (limits.at_least_near.3) crashed TIN's server.
    question: >
      Does TIN bound the combinations an AT LEAST inside NEAR or THEN
      expands to? 8 of 16 answers, 15 of 30 restarts the server; where is
      the line, and is a refusal planned?

  - id: limits.regex_size.1
    against: [tin-1.0.3, tin-1.0.4]
    kind: limit
    captures: [ids]
    summary: Stannum refuses a regex that compiles past 2 MiB (\w{100}); TIN answers.
    tin: Answers {4} (a 100-letter term) in about 0.25 s.
    stannum: 54001 "... regex "\w{100}" compiles to more than 2 MiB".
    question: >
      What bounds the compiled size of one regex, and of all the regexes of
      one query? 200 regexes of \w{10} each answer; is there a limit short
      of the backend's memory?

  - id: limits.regex_size.2
    against: [tin-1.0.3, tin-1.0.4]
    kind: limit
    captures: [ids]
    summary: Stannum refuses a regex that compiles past 2 MiB ([\p{L}]{200}); TIN answers.
    tin: Answers {} in about 0.39 s.
    stannum: 54001 "... regex "[\p{L}]{200}" compiles to more than 2 MiB".
    question: Is a regex compile-size limit documented or planned?

  # ---- TIN 1.0.4: stemming. Stannum stems as TIN does; the entries are
  # the custom scan improvement and the timing of a changed stemmer.

  - id: stemming.ddl.alter_reindex
    against: tin-1.0.4
    kind: gap
    captures: [script]
    summary: >
      Stannum applies a changed stemmer at REINDEX only; it lacks TIN's
      stemming of query terms between ALTER INDEX and REINDEX.
    tin: >
      ALTER INDEX SET (stemmer = 'en') stems query terms at once and stored
      terms after REINDEX, so before the REINDEX 'running' matches only "I
      run"; RESET (stemmer) likewise leaves 'running' matching nothing.
    stannum: >
      Persists the tokenizer settings, the stemmer with them, at build:
      queries and stored terms are analyzed alike until REINDEX applies the
      change (by design; every tokenizer option behaves so in Stannum).
    question: >
      Is stemming queries before the stored terms are rebuilt intended, or
      should a changed stemmer wait for REINDEX as stored terms do?

  - id: stemming.match.custom_scan_off
    against: tin-1.0.4
    kind: improvement
    captures: [custom_scan_off]
    summary: TIN refuses a stemmed index query without its custom scan; Stannum answers it.
    tin: >
      XX000 "queries targeting a tin index with non-default tokenization
      require a usable tin custom scan path" (as catalog.K-12).
    stannum: The same stemmed matches with the custom scan on and off.
    question: >
      Why is this not supported? The heap recheck could analyze with the
      index's settings, as the custom scan does.

  # ---- TIN 1.0.4: the catalog inventory. The names differ by design.

  - id: inventory.settings.1
    against: tin-1.0.4
    kind: gap
    captures: [script]
    summary: Stannum's settings are its own (stannum.*), not TIN's debug, build and maintenance settings.
    tin: >
      14 settings: build_io_concurrency, eight debug_* calibration settings,
      enable_custom_scan, index_maintenance_mode, maintenance_jobs_per_db,
      rss_baseline, track_page_reuse_stats.
    stannum: >
      20 settings of its own (build, write buffer, merge, cache, count and
      expansion limits); enable_custom_scan is the one name both define.
      TIN's other names are not defined (see catalog.I-07).

  - id: inventory.functions.1
    against: tin-1.0.4
    kind: gap
    captures: [value]
    summary: Stannum's schema holds other functions and signatures than TIN's.
    tin: >
      28 functions, among them fsck, fsm_rebuild, merge, promote, ql_parse,
      the planner support functions, and stemmer arguments on tokenize(),
      highlight(), highlight_ansi() and ql_parse(), with their 1.0.3
      signatures kept as *_v1_0_3.
    stannum: >
      The scoring, highlighting, tokenize, ql_parse, score_inspect and
      segment_info functions without stemmer arguments, highlight() over a
      bound query, and its own (bind_query, verify_index, wal_rmgr_id and
      others); no fsck, fsm_rebuild, merge or promote.

  - id: inventory.access_method.1
    against: tin-1.0.4
    kind: gap
    captures: [operators]
    summary: Stannum defines a second ==> operator, text ==> stannum.indexed_query, for bound queries.
    tin: One ==> operator, text ==> text.
    stannum: text ==> text and text ==> stannum.indexed_query.

  # ---- Later TIN behavior, through Lead.

  - id: catalog.S-11
    against: [tin-1.0.3, tin-1.0.4]
    kind: newer
    captures: [not_overlapping]
    summary: The excluded side of NOT OVERLAPPING adds no scoring term, as in TIN's later fix; 1.0.3 and 1.0.4 scored it.
    tin: score_inspect('a NOT OVERLAPPING b') lists a and b, each with weight 1.
    stannum: Lists a only. The right side of NOT ENCLOSES, NOT ENCLOSED BY and NOT OVERLAPPING only filters, as with AND NOT.
    evidence: >
      Lead b8018ac (2026-10-07, "Copy tinql and boldi-vigna bug fixes from
      TIN") collects scoring terms from a span's included leaves only, and
      documents it in the query-language guide (span relations, boost).
    question: >
      Which TIN release first stops scoring the excluded side of a negated
      span relation?

  - id: span.minimal_interval.4
    against: [tin-1.0.3, tin-1.0.4]
    kind: newer
    captures: [ids]
    summary: A phrase NEAR one of its own words matches a second occurrence of that word, as in TIN's later fix.
    tin: >
      '"a b" NEAR/2 b' matches none of "a b b c d", "a b c b d", "a b x x b".
    stannum: Matches all three; the phrase's b and the other operand's b are distinct occurrences.
    evidence: &near_slots >
      Lead b8018ac (2026-10-07, "Copy tinql and boldi-vigna bug fixes from
      TIN"): boldi-vigna's NEAR takes disjoint occurrences for its operands
      (near_slot_tests: repeated_wide_operand_takes_disjoint_occurrences;
      proximity.md: each operand matches at its own position). Lead e3ed2f4
      answers [4, 5, 6] here, as Stannum does.
    question: &near_question >
      Which TIN release first matches a NEAR operand against an occurrence
      the other operand's phrase does not use?

  - id: span.minimal_interval.5
    against: [tin-1.0.3, tin-1.0.4]
    kind: newer
    captures: [ids]
    summary: A phrase NEAR/1 one of its own words matches a second occurrence of that word, as in TIN's later fix.
    tin: >
      '"a b" NEAR/1 b' matches none of the rows.
    stannum: Matches "a b b c d" and "a b c b d".
    evidence: *near_slots
    question: *near_question

  - id: span.minimal_interval.6
    against: [tin-1.0.3, tin-1.0.4]
    kind: newer
    captures: [ids]
    summary: A word NEAR a phrase containing it matches a second occurrence of the word, as in TIN's later fix.
    tin: >
      'b NEAR/2 "a b"' matches none of the rows.
    stannum: Matches all three rows that hold a second b.
    evidence: *near_slots
    question: *near_question
