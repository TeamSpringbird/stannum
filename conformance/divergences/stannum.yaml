# Where Stannum knowingly answers differently from a recorded engine.
#
# In check mode the runner reads this file for the engine under test and the
# recorded engine-version named by `against` (one version or a list). A
# listed case reports
#   IMPROVED  when kind is improvement: the recorded engine raised an ERROR on
#             each listed capture and Stannum answered;
#   GAP       when kind is gap: Stannum lacks what the case exercises.
# Either way only the listed captures may differ. If another capture differs,
# a listed capture matches again, or an improvement stops answering, the case
# FAILs, so this file cannot hide a regression.
#
# `question` is what we would ask the recorded engine's authors.

divergences:
  - id: catalog.S-14
    against: [tin-1.0.3, tin-1.0.4]
    kind: improvement
    captures: [different_dense_ratio, row_dependent_k1]
    summary: TIN refuses differing dense_ratio arguments and a row-dependent k1; Stannum scores each call with its own arguments.
    tin: >
      XX000 "tin.score() calls on one relation must use identical dense_ratio
      arguments" and "tin.score() parameters must be statement-constant
      expressions or external parameters".
    stannum: Every call is scored with its own dense_ratio and, per row, its own k1.
    question: >
      Why are these not supported? k1 may already differ between calls in
      one statement; is dense_ratio fixed because elision is decided once per
      scan, and is a row-dependent k1 refused for the same reason?

  - id: catalog.S-15
    against: [tin-1.0.3, tin-1.0.4]
    kind: improvement
    captures: [value]
    summary: TIN refuses score() and full_score() on one relation; Stannum returns both.
    tin: >
      XX000 "tin.score() and tin.full_score() cannot be combined on one
      scanned relation; use one scoring function per relation".
    stannum: Both functions are answered in the same statement, each with its own value.
    question: >
      Why is this not supported? Is it because the scan computes one kind of
      score per relation, and would it be accepted if the scan computed both?

  - id: catalog.S-22
    against: [tin-1.0.3, tin-1.0.4]
    kind: improvement
    captures: [full_bits, score_bits]
    summary: TIN refuses to score with its custom scan disabled; Stannum returns the same scores either way.
    tin: >
      With the custom scan on, the scores Stannum also returns; with it off,
      XX000 (scoring requires TIN's custom scan).
    stannum: Bit-identical scores with stannum.enable_custom_scan on and off.
    question: >
      Why is scoring not supported without the custom scan? A plan the
      planner is free to choose, or a user setting, then decides whether a
      query succeeds.

  - id: catalog.K-12
    against: [tin-1.0.3, tin-1.0.4]
    kind: improvement
    captures: [custom_scan_off]
    summary: TIN refuses a non-default-tokenization index query without its custom scan; Stannum answers it.
    tin: >
      With the custom scan off, XX000 "queries targeting a tin index with
      non-default tokenization require a usable custom scan".
    stannum: The same matches with the custom scan on and off.
    question: >
      Why is this not supported? The docs do not mention that non-default
      tokenization depends on the custom scan.

  - id: catalog.H-14
    against: tin-1.0.3
    kind: improvement
    captures: [highlight]
    summary: TIN refuses implicit highlight() on a non-default-tokenization index; Stannum highlights with the index's tokenizer.
    tin: >
      XX000 "implicit tin.highlight() is not supported with non-default index
      tokenization".
    stannum: Highlights with the index's tokenizer, here case_folding=preserve.
    question: >
      Why is this not supported? The explicit form works; is the implicit
      form missing the index's tokenizer options?
    note: TIN 1.0.4 answers it as Stannum does, so the entry applies to 1.0.3 only.

  - id: catalog.S-07
    against: [tin-1.0.3, tin-1.0.4]
    kind: gap
    captures: [script]
    summary: >
      Stannum's promote() folds a write buffer of any size, after which w (in
      every row) is elided; TIN's leaves these 20 rows in its mutable segment.
    tin: >
      tin.promote(index) consumes only a sealed write segment (12,288 rows);
      the 20 rows stay mutable, and elision, which counts immutable segments
      only, still scores w after it.
    stannum: >
      Before the promote step the scores equal TIN's. stannum.promote() folds
      the 20 buffered rows into a segment, elision then counts them, and w,
      in every document, scores 0 under score() after it; full_score() is
      unchanged. Whether promote() should fold a buffer below the sealing
      threshold is an open decision.

  - id: catalog.S-07b
    against: [tin-1.0.3, tin-1.0.4]
    kind: gap
    captures: [script]
    summary: Stannum has no promote() and its segment_info() has other columns, so the promote steps differ.
    tin: >
      promote() returns one row (consumed_controls, linked_segments,
      docs_promoted, terms_added); here all zero, as the 20 rows sit in the
      current write segment, which promote() does not consume.
    stannum: No promote(); its write buffer is folded into segments by inserts and VACUUM.

  - id: catalog.S-07c
    against: [tin-1.0.3, tin-1.0.4]
    kind: gap
    captures: [script]
    summary: Stannum has no promote() and its segment_info() has other columns, so the promote steps differ.
    tin: promote() on an index whose rows were all built into an immutable segment returns zeros.
    stannum: No promote().

  - id: catalog.S-07d
    against: [tin-1.0.3, tin-1.0.4]
    kind: gap
    captures: [script]
    summary: Stannum has no promote() and its segment_info() has other columns, so the promote steps differ.
    tin: promote() returns zeros with 200 rows in the current write segment; nothing is elided before or after.
    stannum: No promote().

  - id: catalog.S-07e
    against: [tin-1.0.3, tin-1.0.4]
    kind: gap
    captures: [script]
    summary: Stannum has no promote() and its segment_info() has other columns, so the promote steps differ.
    tin: promote() returns zeros on a built index.
    stannum: No promote().

  - id: catalog.S-07f
    against: [tin-1.0.3, tin-1.0.4]
    kind: gap
    captures: [script]
    summary: Stannum has no promote(), sealed write segments or maintenance modes.
    tin: >
      With maintenance manual, 12,288 rows fill a sealed write segment;
      promote() consumes it (1, 1, 12288, 12293) and elision then counts
      the promoted documents only.
    stannum: No promote(); elision counts every document the index holds.

  - id: catalog.S-07g
    against: [tin-1.0.3, tin-1.0.4]
    kind: gap
    captures: [script]
    summary: Stannum has no promote(index, extent_cap_bytes).
    tin: promote(index, 1) writes 68 segments of about 185 documents; elision is unchanged.
    stannum: No promote().

  - id: limits.at_least_near.2
    against: tin-1.0.3
    kind: limit
    captures: [ids]
    summary: Stannum refuses AT LEAST inside a proximity operator past 10,000 combinations (C(16, 8) = 12,870); TIN answers.
    tin: Answers {3} in about 0.65 s over 27 rows.
    stannum: >
      54001 "... AT LEAST 8 OF 16 operands inside a proximity operator expands
      to more than 10000 combinations". The same expansion at C(30, 15)
      (limits.at_least_near.3) crashed TIN's server.
    question: >
      Does TIN bound the combinations an AT LEAST inside NEAR or THEN
      expands to? 8 of 16 answers, 15 of 30 restarts the server; where is
      the line, and is a refusal planned?

  - id: limits.regex_size.1
    against: [tin-1.0.3, tin-1.0.4]
    kind: limit
    captures: [ids]
    summary: Stannum refuses a regex that compiles past 2 MiB (\w{100}); TIN answers.
    tin: Answers {4} (a 100-letter term) in about 0.25 s.
    stannum: 54001 "... regex "\w{100}" compiles to more than 2 MiB".
    question: >
      What bounds the compiled size of one regex, and of all the regexes of
      one query? 200 regexes of \w{10} each answer; is there a limit short
      of the backend's memory?

  - id: limits.regex_size.2
    against: [tin-1.0.3, tin-1.0.4]
    kind: limit
    captures: [ids]
    summary: Stannum refuses a regex that compiles past 2 MiB ([\p{L}]{200}); TIN answers.
    tin: Answers {} in about 0.39 s.
    stannum: 54001 "... regex "[\p{L}]{200}" compiles to more than 2 MiB".
    question: Is a regex compile-size limit documented or planned?

  # ---- TIN 1.0.4: stemming. Stannum has no stemmer: no index option, no
  # stemmer argument to tokenize() or highlight(). CREATE INDEX WITH
  # (stemmer = ...) raises 22023 "unrecognized parameter", so every case on
  # a stemmed corpus is a corpus gap.

  - id: stemming.tokenize.en
    against: tin-1.0.4
    kind: gap
    captures: [value]
    summary: Stannum's tokenize() has no stemmer argument.
    tin: tokenize('runs running ...', stemmer => 'en') returns Snowball stems (run, run, runner, ran, easili, ...).
    stannum: 42883, no tokenize() with a stemmer argument. The unstemmed capture matches.

  - id: stemming.tokenize.fold_order
    against: tin-1.0.4
    kind: gap
    captures: [value, accents_preserved]
    summary: Stannum's tokenize() has no stemmer argument.
    tin: Stems after lowercasing and before accent folding (Running CAFÉS -> run, cafe; with accents preserved, café).
    stannum: 42883, no tokenize() with a stemmer argument.

  - id: stemming.tokenize.languages
    against: tin-1.0.4
    kind: gap
    captures: [value]
    summary: Stannum has no Snowball stemmers.
    tin: tokenize(..., stemmer => code) stems in each of the 18 documented languages.
    stannum: 42883, no tokenize() with a stemmer argument.

  - id: stemming.tokenize.codes
    against: tin-1.0.4
    kind: gap
    captures: [hy, unknown, name, upper, empty, 'null']
    summary: Stannum's tokenize() has no stemmer argument, so neither the code errors nor stemmer => NULL apply.
    tin: XX000 "unknown stemmer language code" for hy, xx, english, EN and ''; stemmer => NULL does not stem.
    stannum: 42883, no tokenize() with a stemmer argument.

  - id: stemming.tokenize.case_preserve
    against: tin-1.0.4
    kind: gap
    captures: [value]
    summary: Stannum's tokenize() has no stemmer argument.
    tin: XX000 "stemming requires case_folding = fold".
    stannum: 42883, no tokenize() with a stemmer argument.

  - id: stemming.ddl.errors
    against: tin-1.0.4
    kind: gap
    captures: [unknown_code, case_preserve, alter_unknown, alter_case_preserve]
    summary: >
      Stannum has no stemmer index option, so it refuses it as an unknown
      parameter (22023) where TIN validates it (XX000).
    tin: >
      XX000 "unknown stemmer language code: xx" and "stemming requires
      case_folding = fold", in CREATE and ALTER INDEX.
    stannum: 22023 "unrecognized parameter "stemmer"".

  - id: stemming.ddl.alter_reindex
    against: tin-1.0.4
    kind: gap
    captures: [script]
    summary: Stannum has no stemmer index option; ALTER INDEX SET (stemmer) fails and matching stays unstemmed.
    tin: >
      ALTER INDEX SET (stemmer = 'en') stems query terms at once and stored
      terms after REINDEX; RESET (stemmer) likewise.
    stannum: 22023 "unrecognized parameter "stemmer"" for SET and RESET; REINDEX changes nothing.

  - id: stemming.match.term
    against: tin-1.0.4
    kind: gap
    captures: [corpus]
    summary: Stannum has no stemmer index option, so it cannot build the stemmed corpus.
    tin: run, runs and running match one another; runner and ran stay separate terms.
    stannum: 22023 "unrecognized parameter "stemmer"" at CREATE INDEX.

  - id: stemming.match.write_buffer
    against: tin-1.0.4
    kind: gap
    captures: [corpus]
    summary: Stannum has no stemmer index option, so it cannot build the stemmed corpus.
    tin: Rows in the write buffer are stemmed like built rows.
    stannum: 22023 "unrecognized parameter "stemmer"" at CREATE INDEX.

  - id: stemming.match.boolean
